<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Health Assistant</title>
<style>
  :root {
    --bg: #0b1020; --panel: #121a33; --border: #24305a;
    --text: #e6eaf5; --muted: #8b95b8; --accent: #ffb547;
    --user: #2b6cff; --bot: #1b2547;
    --low: #3ecf8e; --moderate: #ffb547; --high: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; justify-content: center; align-items: center; min-height: 100vh; }

  /* .chatbox is self-contained and can be embedded elsewhere */
  .chatbox { width: 100%; max-width: 420px; height: 620px; background: var(--panel);
             border: 1px solid var(--border); border-radius: 16px;
             display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .chat-header h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .chat-header h2::before { content: "☀"; color: var(--accent); }
  .status { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .status b { color: var(--text); font-weight: 600; }
  .risk { padding: 1px 8px; border-radius: 999px; font-weight: 600; color: #0b1020; }
  .risk.low { background: var(--low); } .risk.moderate { background: var(--moderate); }
  .risk.high { background: var(--high); }

  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.45;
         font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { background: #4a1d24; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%;
                 background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }

  .suggestions { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .suggestions button { background: transparent; color: var(--muted); border: 1px solid var(--border);
                        border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .suggestions button:hover { color: var(--text); border-color: var(--accent); }

  .input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .input input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                 border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
  .input input:focus { border-color: var(--accent); }
  .input button { background: var(--accent); color: #0b1020; border: 0; border-radius: 10px;
                  padding: 0 16px; font-weight: 700; cursor: pointer; }
  .input button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<div class="chatbox">
  <div class="chat-header">
    <h2>Solar Health Assistant</h2>
    <div class="status">
      <span>❤ <b id="hr">–</b> bpm</span>
      <span>UV <b id="uv">–</b></span>
      <span>🌡 <b id="temp">–</b>°C</span>
      <span class="risk" id="risk">–</span>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hi! I can see your vitals and NASA solar radiation data. Ask me anything.</div>
  </div>

  <div class="suggestions" id="suggestions">
    <button>Is it safe to go for a run now?</button>
    <button>What does the UV index mean?</button>
    <button>Why is my risk score this high?</button>
  </div>

  <form class="input" id="form">
    <input id="text" placeholder="Type a message…" autocomplete="off" maxlength="1000">
    <button id="send">➤</button>
  </form>
</div>

<script>
  // If this page is served from another origin, put the backend URL here.
  const API = "";

  const $ = id => document.getElementById(id);
  const history = [];

  function addMsg(role, text, cls = "") {
    const el = document.createElement("div");
    el.className = `msg ${role} ${cls}`;
    el.textContent = text;
    $("messages").appendChild(el);
    $("messages").scrollTop = $("messages").scrollHeight;
    return el;
  }

  function showTyping() {
    const el = addMsg("bot", "");
    el.classList.add("typing");
    el.innerHTML = "<span></span><span></span><span></span>";
    return el;
  }

  function updateStatus(ctx) {
    $("hr").textContent = ctx.vitals.heart_rate ?? "–";
    $("uv").textContent = ctx.solar.uv_index ?? "–";
    $("temp").textContent = ctx.solar.air_temp_c ?? "–";
    const r = $("risk");
    r.className = `risk ${ctx.risk.level}`;
    r.textContent = `Risk ${ctx.risk.score}`;
    r.title = ctx.risk.reasons.join(", ") || "All good";
  }

  async function refreshContext() {
    try { updateStatus(await (await fetch(`${API}/api/context`)).json()); } catch {}
  }

  // Cooldown between messages (the server enforces it too: 1 message / 4 s).
  const COOLDOWN_S = 4;
  let cooldownTimer = null;
  function startCooldown(secs) {
    const btn = $("send");
    clearInterval(cooldownTimer);
    let left = Math.max(1, Math.ceil(secs));
    btn.disabled = true; btn.textContent = left;
    cooldownTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) { clearInterval(cooldownTimer); btn.disabled = false; btn.textContent = "➤"; }
      else btn.textContent = left;
    }, 1000);
  }
  function errorText(res, data) {
    if (typeof data.detail === "string") return data.detail;
    if (res.status === 422) return "Message too long (max 1000 characters).";
    return res.statusText || "Something went wrong.";
  }

  async function send(text) {
    text = text.trim();
    if (!text || $("send").disabled) return;
    $("suggestions").style.display = "none";
    addMsg("user", text);
    $("text").value = "";
    $("send").disabled = true;
    const typing = showTyping();
    let cooldown = COOLDOWN_S;
    try {
      const res = await fetch(`${API}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) {
        cooldown = +(res.headers.get("Retry-After") || COOLDOWN_S);
        throw new Error(errorText(res, data));
      }
      addMsg("bot", data.reply);
      history.push({ role: "user", content: text }, { role: "assistant", content: data.reply });
      updateStatus(data.context);
    } catch (e) {
      typing.remove();
      addMsg("bot", "⚠ " + e.message, "error");
    } finally {
      startCooldown(cooldown);
      $("text").focus();
    }
  }

  $("form").addEventListener("submit", e => { e.preventDefault(); send($("text").value); });
  $("suggestions").addEventListener("click", e => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });

  refreshContext();
  setInterval(refreshContext, 10000);
</script>
</body>
</html>
